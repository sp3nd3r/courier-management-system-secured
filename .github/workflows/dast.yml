# Dynamic scan. Separate from security.yml (SAST) on purpose: this one has to
# stand up MySQL and a real web server, takes ~15-25 minutes, and tests the
# running application rather than the source.
name: dast-scan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: DAST — OWASP ZAP (full active scan)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_pw
          MYSQL_DATABASE: royal_express_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      # connection.php reads these before falling back to the private config
      # file, so the application needs no code change to run in CI.
      DB_HOST: 127.0.0.1
      DB_NAME: royal_express_db
      DB_USER: root
      DB_PASS: ci_root_pw
      APP_PORT: "8080"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -p"$DB_PASS" --silent 2>/dev/null; then
              echo "mysql ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "mysql never became ready"; exit 1

      - name: Load schema and seed data
        run: mysql -h 127.0.0.1 -uroot -p"$DB_PASS" "$DB_NAME" < Database/royal_express_db.sql

      - name: Provision the private config directory
        run: |
          mkdir -p "$RUNNER_TEMP/royal_express_private"
          echo "RE_PRIVATE_DIR=$RUNNER_TEMP/royal_express_private" >> "$GITHUB_ENV"

      # The dump seeds plaintext passwords ('testuser1'), which the remediated
      # login can never match because it now uses password_verify(). Without
      # this the seeded accounts are unusable. The tool is idempotent.
      - name: Re-hash seeded plaintext passwords
        run: php tools/hash_existing_passwords.php

      # php -S ignores .htaccess, so the router reproduces the one rule that
      # must hold: baseline/ (deliberately vulnerable) is never executable.
      #
      # PHP_CLI_SERVER_WORKERS matters more than it looks. The built-in server
      # handles ONE request at a time by default, while ZAP attacks with several
      # concurrent threads, so without workers every attack request queues behind
      # the previous one and the scan is bound by the server, not by ZAP.
      - name: Start the application
        run: |
          PHP_CLI_SERVER_WORKERS=8 \
          php -S 0.0.0.0:"$APP_PORT" -t . .github/ci/router.php \
            > "$RUNNER_TEMP/php-server.log" 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$APP_PORT/" || true)
            if [ "$code" = "200" ]; then echo "application up (HTTP $code)"; exit 0; fi
            sleep 2
          done
          echo "application failed to start; last HTTP code: ${code:-none}"
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      # If this ever regresses, ZAP would be attacking pre-remediation code and
      # every finding would be meaningless. Fail loudly instead.
      - name: Verify the vulnerable baseline is not reachable
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:$APP_PORT/baseline/server/inc/get.php")
          if [ "$code" != "403" ]; then
            echo "baseline/ is reachable (HTTP $code) — aborting"; exit 1
          fi
          echo "baseline/ correctly denied (HTTP 403)"

      # ZAP runs inside a container, so localhost there is not the runner.
      # The docker0 gateway address is reachable either way.
      - name: Resolve the address ZAP should target
        run: |
          HOST_IP=$(ip -4 -o addr show docker0 2>/dev/null | awk '{print $4}' | cut -d/ -f1)
          [ -n "$HOST_IP" ] || HOST_IP=127.0.0.1
          echo "resolved host address: $HOST_IP"
          curl -s -o /dev/null -w "  reachable on that address: HTTP %{http_code}\n" \
            "http://$HOST_IP:$APP_PORT/"
          echo "ZAP_TARGET=http://$HOST_IP:$APP_PORT/" >> "$GITHUB_ENV"

      - name: OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: ${{ env.ZAP_TARGET }}
          # -a  include alpha-quality passive rules
          # -m  minutes to spider for
          # -T  max minutes to wait for ZAP to start and the PASSIVE scan to run.
          #     It does NOT bound the active scan, which is uncapped by default —
          #     that is what let the first run pass 18 minutes with no ceiling.
          # -z  passed through to ZAP itself; this is the real active-scan cap.
          cmd_options: '-a -m 5 -T 10 -z "-config ascan.maxScanDurationInMins=20"'
          # This is coursework, not a triage queue: do not open GitHub issues,
          # and do not fail the build merely because findings exist.
          allow_issue_writing: false
          fail_action: false

      - name: Upload the application server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-server-log
          path: ${{ runner.temp }}/php-server.log
          if-no-files-found: warn
