name: security-scan
on:
  push:
  pull_request:
  # Lets the scan be re-run on unchanged code from the Actions tab, so the
  # remediation evidence can be regenerated without inventing a dummy commit.
  workflow_dispatch:
jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      # The three assignment rules report ZERO findings against the fixed code.
      # On its own that is indistinguishable from rules that are broken or never
      # loaded, so prove they still fire against the pre-fix patterns first. This
      # step is deliberately NOT tolerant of failure: if it fails, the clean scan
      # below cannot be trusted and the build stops here.
      - name: Verify assignment rules still fire (self-test)
        run: |
          semgrep --test --metrics=off \
            --config .semgrep/royal-express.yml \
            .semgrep/royal-express.php

      # The OPEN column. baseline/ is a frozen copy of the pre-remediation code,
      # so this is also a live proof that the rules still fire: if it stops
      # reporting findings, the clean application scan below means nothing.
      # Deliberately NOT uploaded to code scanning - these are not app defects.
      - name: Scan pre-remediation baseline (OPEN side)
        run: |
          semgrep --config .semgrep/royal-express.yml \
            --metrics=off --json --output baseline.json baseline/ || true

      # Both excludes matter. .semgrep holds the rule test fixture and baseline/
      # holds the pre-fix code; either one left in reports as real findings and
      # would make the fixed application look unremediated in the Security tab.
      - name: Scan application (registry PHP pack + assignment rules)
        run: |
          set -o pipefail
          for fmt in sarif json; do
            semgrep --config p/php --config .semgrep/royal-express.yml \
              --metrics=off --exclude=.semgrep --exclude=baseline \
              --"$fmt" --output "semgrep.$fmt" . || true
          done
          echo "----- Semgrep summary -----"
          semgrep --config p/php --config .semgrep/royal-express.yml \
            --metrics=off --exclude=.semgrep --exclude=baseline . || true

      - name: Publish V-01/V-02/V-03 status to job summary
        if: always()
        run: python3 .github/scripts/vuln_summary.py

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
            baseline.json
