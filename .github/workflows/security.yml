name: security-scan
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      # This step is deliberately NOT tolerant of failure: if it fails, the clean scan
      # below cannot be trusted and the build stops here.
      - name: Verify assignment rules still fire (self-test)
        run: |
          semgrep --test --metrics=off \
            --config .semgrep/royal-express.yml \
            .semgrep/royal-express.php

      # The OPEN column is the  pre-remediation code.
      - name: Scan pre-remediation baseline (OPEN side)
        run: |
          semgrep --config .semgrep/royal-express.yml \
            --metrics=off --json --output baseline.json baseline/ || true

      # .semgrep holds the rule test
      - name: Scan application (registry PHP pack + assignment rules)
        run: |
          set -o pipefail
          for fmt in sarif json; do
            semgrep --config p/php --config .semgrep/royal-express.yml \
              --metrics=off --exclude=.semgrep --exclude=baseline \
              --"$fmt" --output "semgrep.$fmt" . || true
          done
          echo "----- Semgrep summary -----"
          semgrep --config p/php --config .semgrep/royal-express.yml \
            --metrics=off --exclude=.semgrep --exclude=baseline . || true

      - name: Publish V-01/V-02/V-03 status to job summary
        if: always()
        run: python3 .github/scripts/vuln_summary.py

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: |
            semgrep.sarif
            semgrep.json
            baseline.json

  # Software Composition Analysis. Semgrep reads the code this project owns;
  # this reads the code it borrowed - the bundled jQuery/Bootstrap under js/ -
  # and matches those versions against known CVEs.
  #
  # needs: sast makes it run after the Semgrep job rather than beside it. A
  # consequence worth knowing: if sast fails, this is skipped rather than run.
  dependency-check:
    name: SCA - OWASP Dependency-Check
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'royal-express'
          path: '.'
          format: 'HTML'

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
