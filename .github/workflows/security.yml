name: security-scan
on: [push, pull_request]
jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Semgrep (PHP ruleset)
        run: |
          pip install semgrep
          semgrep --config p/php --sarif --output semgrep.sarif . || true
          echo "----- Semgrep summary -----"
          semgrep --config p/php . || true
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
